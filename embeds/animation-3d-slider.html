<!DOCTYPE html>
<!--
  animation-3d-slider.html
  ---------------------------------------------------------------------------
  "3D Animation" service panel: the Arturia MiniLab teaser (2026-11-21) with a
  draggable divider that reveals the solid-shaded geometry under the Cycles
  render, live, while the video plays.

  How the sync works: ONE video file holds both versions stacked vertically
  (assets/video/arturia_render_geometria.mp4, 1280x1440: top = graded render,
  bottom = viewport solid, same frames 1-1116, music track 46.5 s). Every frame
  is drawn to a canvas: the render half left of the divider, the geometry
  half right of it. A single decoder means the two can never drift apart.

  Idle behaviour: the divider makes a slow sweep every few seconds so people
  see it can be dragged; it stops for good once someone drags it (and never
  runs with prefers-reduced-motion). Sound starts muted (browser autoplay
  rules); the speaker button unmutes. Language: ?lang=es for Spanish labels.

  Source frames: Tutogram/Arturia/04_Render/teaser_fotogramas_limpio_grade +
  geometria_solid. Served from this site (assets/video/), not jsDelivr: the
  libelamodelos3d repo is past jsDelivr's 50 MB package limit.
-->
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0b;
    --white: #ffffff;
    --black: #000000;
    --yellow: #ffff00;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Lato', Arial, sans-serif;
  }
  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    cursor: ew-resize;
    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  video { display: none; }

  .divider {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    width: 0;
    pointer-events: none;
    will-change: transform;
  }
  .divider::before {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: -1px;
    width: 2px;
    background: rgba(255, 255, 255, 0.7);
    box-shadow: 0 0 12px rgba(0, 0, 0, 0.35);
  }
  .grip {
    position: absolute;
    top: 50%;
    left: 0;
    width: 44px;
    height: 44px;
    margin: -22px 0 0 -22px;
    border-radius: 50%;
    background: var(--white);
    color: var(--black);
    display: grid;
    place-items: center;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
    pointer-events: auto;
    transition: transform 0.15s ease;
  }
  .grip svg { width: 22px; height: 22px; }
  .stage.dragging .grip,
  .grip:hover { transform: scale(1.08); }
  .grip:focus-visible {
    outline: 3px solid var(--yellow);
    outline-offset: 3px;
  }

  .label {
    position: absolute;
    bottom: 14px;
    padding: 6px 11px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.55);
    color: var(--white);
    font-weight: 900;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .label.render { left: 14px; }
  .label.geo { right: 14px; background: rgba(255, 255, 255, 0.8); color: var(--black); }

  .sound {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.55);
    color: var(--white);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .sound:hover { background: var(--black); color: var(--yellow); }
  .sound:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .sound svg { width: 20px; height: 20px; }
  .sound .on { display: none; }
  .sound[aria-pressed="true"] .on { display: block; }
  .sound[aria-pressed="true"] .off { display: none; }

  @media (max-width: 520px) {
    .label { font-size: 11px; letter-spacing: 0.12em; bottom: 10px; padding: 5px 9px; }
    .label.render { left: 10px; }
    .label.geo { right: 10px; }
    .grip { width: 38px; height: 38px; margin: -19px 0 0 -19px; }
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <video id="vid" src="../assets/video/arturia_render_geometria.mp4" autoplay muted loop playsinline preload="auto"></video>
    <canvas id="cv"></canvas>
    <span class="label render" id="lblRender">Render</span>
    <span class="label geo" id="lblGeo">Geometry</span>
    <div class="divider" id="divider">
      <div class="grip" id="grip" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70" aria-label="Render / geometry divider">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l-6 6 6 6"/><path d="M15 6l6 6-6 6"/></svg>
      </div>
    </div>
    <button class="sound" id="sound" type="button" aria-pressed="false" aria-label="Sound on">
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M22 9l-6 6"/><path d="M16 9l6 6"/></svg>
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
    </button>
  </div>
<script>
(function () {
  var ES = /[?&]lang=es\b/.test(location.search);
  var T = ES
    ? { geo: 'Geometría', on: 'Activar sonido', off: 'Silenciar', slider: 'Divisor render / geometría' }
    : { geo: 'Geometry', on: 'Sound on', off: 'Mute', slider: 'Render / geometry divider' };
  document.getElementById('lblGeo').textContent = T.geo;

  var stage = document.getElementById('stage');
  var vid = document.getElementById('vid');
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var divider = document.getElementById('divider');
  var grip = document.getElementById('grip');
  var lblR = document.getElementById('lblRender');
  var lblG = document.getElementById('lblGeo');
  var btn = document.getElementById('sound');
  grip.setAttribute('aria-label', T.slider);
  btn.setAttribute('aria-label', T.on);

  var REST = 0.7;            // resting position: mostly render, a slice of geometry
  var pos = REST;            // 0..1, fraction of width showing render
  var W = 0, H = 0, dpr = 1;
  var userTook = false;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = stage.clientWidth; H = stage.clientHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }

  function draw() {
    var vw = vid.videoWidth, vh = vid.videoHeight / 2;
    if (vw && vid.readyState >= 2) {
      // cover-fit one half (16:9) into the canvas
      var cw = cv.width, ch = cv.height;
      var s = Math.max(cw / vw, ch / vh);
      var sw = cw / s, sh = ch / s;
      var sx = (vw - sw) / 2, sy = (vh - sh) / 2;
      var split = Math.round(cw * pos);
      var srcSplit = sw * pos;
      if (split > 0) ctx.drawImage(vid, sx, sy, srcSplit, sh, 0, 0, split, ch);
      if (split < cw) ctx.drawImage(vid, sx + srcSplit, vh + sy, sw - srcSplit, sh, split, 0, cw - split, ch);
    }
    divider.style.transform = 'translateX(' + (W * pos) + 'px)';
    lblR.style.opacity = pos < 0.16 ? 0 : 1;
    lblG.style.opacity = pos > 0.84 ? 0 : 1;
    grip.setAttribute('aria-valuenow', Math.round(pos * 100));
  }

  // idle sweep: rest -> 0.3 -> rest, eased, every ~7 s, until the user takes over
  var SWEEP = 2600, GAP = 4600, t0 = performance.now() + 1800;
  function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function autoPos(now) {
    var t = (now - t0) % (SWEEP + GAP);
    if (now < t0 || t > SWEEP) return REST;
    var k = t / SWEEP;
    var p = k < 0.5 ? ease(k * 2) : ease((1 - k) * 2);
    return REST - 0.4 * p;
  }

  function loop(now) {
    if (!userTook && !reduce) pos = autoPos(now);
    draw();
    requestAnimationFrame(loop);
  }

  function setFromX(clientX) {
    var r = stage.getBoundingClientRect();
    pos = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
  }
  var dragging = false;
  stage.addEventListener('pointerdown', function (e) {
    if (e.target.closest('.sound')) return;
    dragging = true; userTook = true;
    stage.classList.add('dragging');
    stage.setPointerCapture(e.pointerId);
    setFromX(e.clientX);
  });
  stage.addEventListener('pointermove', function (e) { if (dragging) setFromX(e.clientX); });
  function end() { dragging = false; stage.classList.remove('dragging'); }
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);

  grip.addEventListener('keydown', function (e) {
    var step = e.shiftKey ? 0.1 : 0.03;
    if (e.key === 'ArrowLeft') pos = Math.max(0, pos - step);
    else if (e.key === 'ArrowRight') pos = Math.min(1, pos + step);
    else if (e.key === 'Home') pos = 0;
    else if (e.key === 'End') pos = 1;
    else return;
    userTook = true; e.preventDefault();
  });

  btn.addEventListener('click', function () {
    vid.muted = !vid.muted;
    if (!vid.muted) { vid.volume = 0.8; vid.play(); }
    btn.setAttribute('aria-pressed', String(!vid.muted));
    btn.setAttribute('aria-label', vid.muted ? T.on : T.off);
  });

  // pause while the tab is hidden
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) vid.pause(); else vid.play().catch(function () {});
  });

  // first view opens on the hero shot (frame 147) instead of the dark intro;
  // the loop afterwards plays the whole piece, music included
  var START = 6.1;
  function jump() { try { vid.currentTime = START; } catch (e) {} }
  if (vid.readyState >= 1) jump(); else vid.addEventListener('loadedmetadata', jump, { once: true });

  window.addEventListener('resize', resize);
  resize();
  vid.play().catch(function () {});
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
