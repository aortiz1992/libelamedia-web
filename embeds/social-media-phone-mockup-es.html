<!DOCTYPE html>
<!--
  social-media-phone-mockup.html
  ---------------------------------------------------------------------------
  Embed for the "Engaging social media content" section on the home page.
  Started life as an HTML mockup Gemini produced when asked for a phone+UI
  overlay (see workflows/AI_GENERATED_VIDEO_SOCIALMEDIA/resources/mobile
  overlay/) — its placeholder "screen" was a flat magenta chroma-key
  rectangle meant to be composited over real video in After Effects. Since
  this is real HTML/CSS, that step is unnecessary here: the magenta div was
  replaced with an actual <video> element, and the crude text/emoji icon
  placeholders (♡, "Signal", "WiFi", "Batt"...) were replaced with proper
  Instagram-Reels-style SVG icons.

  Video: social_grifo_final.mp4 — the final After Effects edit from
  workflows/AI_GENERATED_VIDEO_SOCIALMEDIA/04_VIDEO_OUTPUT/Grifo/
  (Final_Video_Grifo.mp4), combining the approved Higgsfield scenes. To swap
  in a different product's video later, just change the VIDEO_URL constant
  near the bottom of the file — nothing else needs to change.

  Account overlay is deliberately a DEMO/PLACEHOLDER client account, not
  Libela's own — same pattern as lunas.pro's own "your.company" mockup: the
  username reads "your.company.here" and the caption is framed as a client
  thanking Libela ("We started our colaboration with Libela Studio!"), so
  a prospect sees this as "this could be your Instagram post." The avatar
  is a quick generic abstract mark (not a real logo), inline SVG so it's
  trivial to swap for a different placeholder mark later.

  Sizing: same JS-computed-pixel-size pattern as every other fixed-aspect
  embed on this site (fitStage() in the carousels, applySize() here) rather
  than CSS aspect-ratio, which has painted incorrectly in this project
  before despite being computed correctly (see project memory). The phone
  mockup targets a 390:844 aspect ratio (iPhone-style) and centers/scales
  to fit whatever box Google Sites gives this embed.

  Served from GitHub + jsDelivr like every other asset on this site
  (aortiz1992/libelamodelos3d).
-->
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Lato', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .wrap {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .phone-bezel {
    position: relative;
    background-color: #000000;
    border-radius: 13.5% / 6%;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    box-sizing: border-box;
  }

  .screen {
    position: relative;
    width: 100%;
    height: 100%;
    background-color: #000000;
    border-radius: 10% / 4.6%;
    overflow: hidden;
    color: #ffffff;
  }

  .screen video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .notch {
    position: absolute;
    top: 1.4%;
    left: 50%;
    transform: translateX(-50%);
    width: 30%;
    height: 3.2%;
    background-color: #000000;
    border-radius: 20px;
    z-index: 10;
  }

  .status-bar {
    position: absolute;
    top: 2%;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 6.5%;
    font-size: 0.8125em;
    font-weight: 700;
    z-index: 8;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  }

  .status-icons {
    display: flex;
    align-items: center;
    gap: 0.3125em;
  }

  .status-icons svg {
    display: block;
  }

  .header {
    position: absolute;
    top: 6%;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4%;
    z-index: 8;
  }

  .header svg {
    stroke: #ffffff;
    filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.5));
  }

  .header .label {
    font-size: 1em;
    font-weight: 700;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  }

  .right-actions {
    position: absolute;
    right: 3.5%;
    bottom: 21%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.125em;
    z-index: 8;
  }

  .action {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.25em;
  }

  .action svg {
    filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.6));
  }

  .action-count {
    font-size: 0.6875em;
    font-weight: 700;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  }

  .bottom-info {
    position: absolute;
    left: 4%;
    right: 20%;
    bottom: 13%;
    display: flex;
    flex-direction: column;
    gap: 0.5em;
    z-index: 8;
  }

  .user-row {
    display: flex;
    align-items: center;
    gap: 0.5em;
  }

  .avatar {
    width: 1.75em;
    height: 1.75em;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff7a45, #ffb648);
    border: 0.09em solid #ffffff;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .avatar svg {
    width: 60%;
    height: 60%;
  }

  .username {
    font-size: 0.8125em;
    font-weight: 700;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    white-space: nowrap;
  }

  .follow-btn {
    border: 0.06em solid #ffffff;
    border-radius: 5px;
    padding: 0.19em 0.56em;
    font-size: 0.6875em;
    font-weight: 700;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    white-space: nowrap;
    flex: none;
  }

  .caption {
    font-size: 0.75em;
    line-height: 1.35;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
  }

  .bottom-nav {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 9%;
    display: flex;
    align-items: center;
    justify-content: space-around;
    background: linear-gradient(to top, rgba(0, 0, 0, 0.55), transparent);
    z-index: 8;
  }

  .bottom-nav svg {
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.5));
  }

  .home-indicator {
    position: absolute;
    bottom: 1.4%;
    left: 50%;
    transform: translateX(-50%);
    width: 34%;
    height: 0.25em;
    background-color: #ffffff;
    border-radius: 10px;
    z-index: 10;
  }
</style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="phone-bezel" id="bezel">
      <div class="screen">
        <video id="reelVideo" autoplay muted loop playsinline preload="auto"
          aria-label="Vista previa de contenido para redes sociales de LIBELAMEDIA"></video>

        <div class="notch"></div>

        <div class="status-bar">
          <span>9:41</span>
          <div class="status-icons">
            <svg width="1.125em" height="0.625em" viewBox="0 0 18 10" fill="#fff"><rect x="0" y="6" width="3" height="4" rx="0.5"/><rect x="5" y="4" width="3" height="6" rx="0.5"/><rect x="10" y="2" width="3" height="8" rx="0.5"/><rect x="15" y="0" width="3" height="10" rx="0.5"/></svg>
            <svg width="1em" height="0.75em" viewBox="0 0 16 12" fill="none" stroke="#fff" stroke-width="1.4"><path d="M1 4a10.6 10.6 0 0 1 14 0"/><path d="M3.6 6.8a7 7 0 0 1 8.8 0"/><path d="M6.2 9.4a3.4 3.4 0 0 1 3.6 0"/></svg>
            <svg width="1.5em" height="0.75em" viewBox="0 0 24 12" fill="none"><rect x="1" y="1" width="19" height="10" rx="2.5" stroke="#fff" stroke-width="1.2"/><rect x="2.5" y="2.5" width="16" height="7" rx="1.2" fill="#fff"/><rect x="21" y="4" width="2" height="4" rx="1" fill="#fff"/></svg>
          </div>
        </div>

        <div class="header">
          <svg width="1.25em" height="1.25em" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
          <span class="label">Reels</span>
          <svg width="1.25em" height="1.25em" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2Z"></path><circle cx="12" cy="13" r="4"></circle></svg>
        </div>

        <div class="right-actions">
          <div class="action">
            <svg width="1.625em" height="1.625em" viewBox="0 0 24 24" fill="#fff"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.2 2 4.5 5.6 4a5 5 0 0 1 6.4 2.3A5 5 0 0 1 18.4 4C22 4.5 23.6 8.2 22 11.7 19.5 16.4 12 21 12 21Z"/></svg>
            <span class="action-count">2.4K</span>
          </div>
          <div class="action">
            <svg width="1.625em" height="1.625em" viewBox="0 0 24 24" fill="#fff"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 8.4 8.4 0 0 1-3.9-.94L3 21l1.94-5.6A8.4 8.4 0 0 1 3.5 11.5 8.5 8.5 0 0 1 12 3a8.5 8.5 0 0 1 9 8.5Z"/></svg>
            <span class="action-count">318</span>
          </div>
          <div class="action">
            <svg width="1.625em" height="1.625em" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            <span class="action-count">Compartir</span>
          </div>
          <div class="action">
            <svg width="1.5em" height="1.5em" viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
          </div>
        </div>

        <div class="bottom-info">
          <div class="user-row">
            <div class="avatar">
              <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 1.5 14.7 9.3 22.5 12 14.7 14.7 12 22.5 9.3 14.7 1.5 12 9.3 9.3Z"/></svg>

            <div class="follow-btn">Seguir</div>
          </div>
          <div class="caption">¡Empezamos nuestra colaboración con LIBELAMEDIA! Visuales impresionantes</div>

        <div class="bottom-nav">
          <svg width="1.375em" height="1.375em" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"></path><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"></path></svg>
          <svg width="1.375em" height="1.375em" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <svg width="1.375em" height="1.375em" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>
          <svg width="1.375em" height="1.375em" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
          <svg width="1.375em" height="1.375em" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21v-1a7 7 0 0 1 14 0v1"></path></svg>
        </div>

        <div class="home-indicator"></div>
      </div>
    </div>
  </div>

  <script>
    var VIDEO_URL = 'https://cdn.jsdelivr.net/gh/aortiz1992/libelamodelos3d@main/social_grifo_final.mp4';
    var PHONE_ASPECT = 390 / 844;
    var BEZEL_PADDING_RATIO = 0.018;
    var REFERENCE_WIDTH = 390;
    var REFERENCE_FONT_PX = 16;

    document.getElementById('reelVideo').src = VIDEO_URL;

    var wrap = document.getElementById('wrap');
    var bezel = document.getElementById('bezel');

    function applySize() {
      var availW = wrap.clientWidth;
      var availH = wrap.clientHeight;
      if (availW <= 0 || availH <= 0) return;
      var w = availW;
      var h = w / PHONE_ASPECT;
      if (h > availH) {
        h = availH;
        w = h * PHONE_ASPECT;
      }
      bezel.style.width = w + 'px';
      bezel.style.height = h + 'px';
      bezel.style.padding = Math.round(w * BEZEL_PADDING_RATIO) + 'px';
      // All UI chrome (icons, text, avatar, spacing) is sized in em so it
      // scales proportionally with the phone at any embed box size —
      // without this, elements stayed at a fixed px size regardless of how
      // small the phone rendered (looked oversized/overlapping on mobile).
      bezel.style.fontSize = (w / REFERENCE_WIDTH * REFERENCE_FONT_PX) + 'px';
    }

    applySize();
    window.addEventListener('resize', applySize);
    window.addEventListener('orientationchange', applySize);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(applySize);
    }
    setTimeout(applySize, 300);
  </script>
</body>
</html>
