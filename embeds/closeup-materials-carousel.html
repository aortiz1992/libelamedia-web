<!DOCTYPE html>
<!--
  closeup-materials-carousel.html
  ---------------------------------------------------------------------------
  Image carousel for the "Detailed Close-Up" content card on the home page
  — same pattern as studio-images-carousel.html (which itself copies
  lunas.pro's L-STUDIO sample gallery): single image display, left/right
  chevron arrows, dot indicators below, click a dot to jump, auto-advances
  on a timer.

  Images: AI-generated (Higgsfield/Gemini material-transfer pipeline, see
  workflows/AI_GENERATED_STUDIO_CLOSEUP/) extreme close-ups showing the same
  kind of object rendered in different materials — wood, metal, marble,
  fabric — post-processed in Photoshop and delivered as the final square
  crops. Served from GitHub + jsDelivr like every other asset on this site
  (aortiz1992/libelamodelos3d).

  Glass is not in this list yet — 04_Delivery only had 4 of the 5 approved
  materials when this embed was built. To add it once it's ready: compress
  the delivered PNG to a CDN-sized JPG, `git add/commit/push` it as
  closeup_glass.jpg in the libelamodelos3d repo, then add one line to the
  IMAGES array below.

  To add/remove/reorder images: edit the IMAGES array in the script below —
  everything else (dots, arrows, autoplay, sizing) rebuilds itself from
  that array.
-->
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Lato', Arial, sans-serif;
  }

  .carousel {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .stage {
    position: relative;
    overflow: hidden;
    border-radius: 6px;
  }

  .stage img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  .stage img.active {
    display: block;
  }

  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.85);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    z-index: 2;
    transition: background 0.15s ease;
  }

  .arrow:hover {
    background: #ffffff;
  }

  .arrow svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: #013f7c;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .arrow.prev {
    left: 12px;
  }

  .arrow.next {
    right: 12px;
  }

  .dots {
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 0 6px 0;
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #d7dbe0;
    border: none;
    cursor: pointer;
    padding: 0;
    transition: background 0.15s ease, transform 0.15s ease;
  }

  .dot:hover {
    background: #9aa6b2;
  }

  .dot.active {
    background: #111111;
    transform: scale(1.2);
  }

  @media (max-width: 700px) {
    .arrow {
      width: 36px;
      height: 36px;
    }
    .arrow svg {
      width: 16px;
      height: 16px;
    }
    .dots {
      gap: 6px;
      padding: 8px 0 4px 0;
    }
    .dot {
      width: 7px;
      height: 7px;
    }
  }
</style>
</head>
<body>
  <div class="carousel">
    <div class="stage" id="stage">
      <button class="arrow prev" id="prevBtn" aria-label="Previous image">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <button class="arrow next" id="nextBtn" aria-label="Next image">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
    </div>
    <div class="dots" id="dots"></div>
  </div>

  <script>
    var IMAGES = [
      'https://cdn.jsdelivr.net/gh/aortiz1992/libelamodelos3d@main/closeup_metal.jpg',
      'https://cdn.jsdelivr.net/gh/aortiz1992/libelamodelos3d@main/closeup_marble.jpg',
      'https://cdn.jsdelivr.net/gh/aortiz1992/libelamodelos3d@main/closeup_fabric.jpg'
    ];

    var AUTOPLAY_MS = 4500;
    var RESUME_AFTER_MS = 6000;

    var carousel = document.querySelector('.carousel');
    var stage = document.getElementById('stage');
    var dotsWrap = document.getElementById('dots');
    var prevBtn = document.getElementById('prevBtn');
    var nextBtn = document.getElementById('nextBtn');

    var current = 0;
    var autoplayTimer = null;
    var resumeTimer = null;

    function fitStage() {
      var availW = carousel.clientWidth;
      var availH = carousel.clientHeight - dotsWrap.offsetHeight;
      if (availW <= 0 || availH <= 0) return;
      var size = Math.max(0, Math.min(availW, availH));
      stage.style.width = size + 'px';
      stage.style.height = size + 'px';
    }

    IMAGES.forEach(function (src, i) {
      var img = document.createElement('img');
      img.src = src;
      img.alt = 'Libela Media material close-up ' + (i + 1);
      if (i === 0) img.className = 'active';
      stage.appendChild(img);

      var dot = document.createElement('button');
      dot.className = 'dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('aria-label', 'Go to image ' + (i + 1));
      dot.addEventListener('click', function () {
        goTo(i);
        userInteracted();
      });
      dotsWrap.appendChild(dot);
    });

    var slides = stage.querySelectorAll('img');
    var dots = dotsWrap.querySelectorAll('.dot');

    function goTo(index) {
      slides[current].classList.remove('active');
      dots[current].classList.remove('active');
      current = (index + IMAGES.length) % IMAGES.length;
      slides[current].classList.add('active');
      dots[current].classList.add('active');
    }

    function next() { goTo(current + 1); }
    function prev() { goTo(current - 1); }

    function startAutoplay() {
      stopAutoplay();
      autoplayTimer = setInterval(next, AUTOPLAY_MS);
    }

    function stopAutoplay() {
      if (autoplayTimer) clearInterval(autoplayTimer);
      autoplayTimer = null;
    }

    function userInteracted() {
      stopAutoplay();
      if (resumeTimer) clearTimeout(resumeTimer);
      resumeTimer = setTimeout(startAutoplay, RESUME_AFTER_MS);
    }

    prevBtn.addEventListener('click', function () { prev(); userInteracted(); });
    nextBtn.addEventListener('click', function () { next(); userInteracted(); });

    fitStage();
    window.addEventListener('resize', fitStage);
    window.addEventListener('orientationchange', fitStage);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(fitStage);
    }
    setTimeout(fitStage, 300);

    startAutoplay();
  </script>
</body>
</html>
