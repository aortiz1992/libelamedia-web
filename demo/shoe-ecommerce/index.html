<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Commerce Store for Shoes — LIBELAMEDIA Demo</title>
<meta name="description" content="Live demo: from a 3D scan to a full shop in 90 minutes — studio images, lifestyle photography, video and a 3D viewer, all generated by LIBELAMEDIA's automated workflow.">
<link rel="canonical" href="https://www.libelamedia.com/demo/shoe-ecommerce/">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    color: #0F1111;
    background: #EAEDED;
  }
  .internal-banner {
    background: #232F3E;
    color: #ffffff;
    text-align: center;
    font-size: 12px;
    padding: 8px 10px;
    letter-spacing: .2px;
  }
  .internal-banner a { color: #FFD814; text-decoration: none; font-weight: 700; }
  .internal-banner a:hover { text-decoration: underline; }

  .sku-switch-wrap {
    max-width: 1160px;
    margin: 18px auto 0;
    padding: 0 20px;
  }
  .sku-switch-title {
    font-size: 13px;
    color: #565959;
    margin-bottom: 8px;
  }
  .sku-switch {
    display: flex;
    gap: 10px;
  }
  .sku-switch button {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: #fff;
    border: 2px solid #D5D9D9;
    border-radius: 6px;
    padding: 8px 10px 10px;
    cursor: pointer;
    width: 92px;
    transition: border-color .15s ease;
  }
  .sku-switch button:hover { border-color: #888; }
  .sku-switch button.active { border-color: #E77600; box-shadow: 0 0 0 1px #E77600 inset; }
  .sku-switch img {
    width: 68px; height: 68px;
    object-fit: contain;
  }
  .sku-switch .sw-name {
    font-size: 11px;
    font-weight: 700;
    color: #0F1111;
  }
  .sku-switch .sw-price {
    font-size: 11px;
    color: #565959;
  }

  .page {
    max-width: 1160px;
    margin: 16px auto 60px;
    padding: 24px;
    background: #fff;
    display: grid;
    grid-template-columns: 620px 1fr;
    gap: 40px;
  }

  .gallery { display: flex; gap: 14px; }
  .thumbs {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 56px;
  }
  .thumb {
    width: 52px; height: 52px;
    border: 1px solid #D5D9D9;
    border-radius: 4px;
    padding: 3px;
    cursor: pointer;
    position: relative;
    background: #fff;
  }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .thumb.active { border: 2px solid #E77600; padding: 2px; }
  .thumb.video-thumb::after {
    content: "";
    position: absolute; inset: 0;
    background: rgba(0,0,0,.15) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="white" opacity="0.9"/><path d="M9 7l9 5-9 5V7z" fill="%23111"/></svg>') center/22px no-repeat;
  }

  .mainstage-col { flex: 1; display: flex; flex-direction: column; align-items: center; }
  .mainstage {
    width: 100%;
    aspect-ratio: 1 / 1;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .mainstage img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .mainstage video { width: 100%; height: 100%; object-fit: contain; background:#fff; }
  .mainstage model-viewer { width: 100%; height: 100%; --poster-color: transparent; }

  .view3d-btn {
    margin-top: 16px;
    background: #fff;
    border: 1px solid #D5D9D9;
    border-radius: 20px;
    padding: 8px 20px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    color: #0F1111;
  }
  .view3d-btn:hover { background: #F7F8F8; }
  .view3d-btn.active { border-color: #E77600; color: #E77600; }

  .info { min-width: 0; }
  .store-link { font-size: 13px; color: #007185; text-decoration: none; }
  .store-link:hover { color: #C7511F; text-decoration: underline; }
  h1 { font-size: 22px; font-weight: 500; margin: 6px 0 8px; line-height: 1.3; }

  .rating-row { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-bottom: 4px; }
  .stars { color: #E77600; font-size: 16px; letter-spacing: -1px; }
  .rating-row a { color: #007185; text-decoration: none; }
  .bought-line { font-size: 13px; color: #565959; margin-bottom: 10px; }

  hr { border: none; border-top: 1px solid #E7E7E7; margin: 12px 0; }

  .price-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .discount { color: #CC0C39; font-size: 20px; font-weight: 500; }
  .price-main { font-size: 28px; color: #0F1111; }
  .price-main sup { font-size: 15px; position: relative; top: -12px; }
  .rrp { font-size: 13px; color: #565959; }
  .rrp span { text-decoration: line-through; }

  .returns { color: #007185; font-size: 14px; margin: 10px 0 6px; cursor: default; }
  .vat-note { font-size: 12px; color: #565959; margin-bottom: 16px; line-height: 1.5; }

  .section-label { font-size: 13px; margin-bottom: 8px; }
  .section-label b { font-weight: 700; }

  .swatch-row { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .swatch {
    border: 2px solid #D5D9D9;
    border-radius: 4px;
    padding: 4px;
    cursor: pointer;
    width: 78px;
    text-align: center;
  }
  .swatch.selected { border-color: #E77600; box-shadow: 0 0 0 1px #E77600 inset; }
  .swatch img { width: 100%; height: 56px; object-fit: contain; }
  .swatch .sp { font-size: 11px; margin-top: 2px; }
  .swatch .sp .sp-old { text-decoration: line-through; color: #565959; display: block; }

  .size-row { margin-bottom: 20px; }
  .size-row label { display: block; font-size: 13px; margin-bottom: 6px; }
  .size-row select {
    width: 220px;
    padding: 8px 10px;
    border: 1px solid #888C8C;
    border-radius: 8px;
    font-size: 14px;
    background: #F0F2F2;
  }

  .add-cart {
    width: 240px;
    background: #FFD814;
    border: 1px solid #FCD200;
    border-radius: 20px;
    padding: 10px 0;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .add-cart:hover { background: #F7CA00; }
  .buy-now {
    width: 240px;
    background: #FFA41C;
    border: 1px solid #FF8F00;
    border-radius: 20px;
    padding: 10px 0;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    display: block;
  }
  .buy-now:hover { background: #FA8900; }

  @media (max-width: 900px) {
    .page { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="internal-banner"><a href="/demo/">← Back to LIBELAMEDIA Demos</a> — automated 3D-scan-to-store workflow, from LIBELAMEDIA</div>

<div class="sku-switch-wrap">
  <div class="sku-switch-title">Switch SKU (click the photo):</div>
  <div class="sku-switch" id="skuSwitch"></div>
</div>

<div class="page">

  <div class="gallery">
    <div class="thumbs" id="thumbs"></div>
    <div class="mainstage-col">
      <div class="mainstage" id="mainstage"></div>
      <button class="view3d-btn" id="view3dBtn">View in 3D</button>
    </div>
  </div>

  <div class="info">
    <a class="store-link" id="storeLink" href="#">Visit the brand Store</a>
    <h1 id="title"></h1>
    <div class="rating-row">
      <span class="stars" id="stars"></span>
      <a href="#" id="reviewCount"></a>
    </div>
    <div class="bought-line" id="boughtLine"></div>
    <hr>
    <div class="price-row">
      <span class="discount" id="discount"></span>
      <span class="price-main" id="priceMain"></span>
    </div>
    <div class="rrp" id="rrp"></div>
    <div class="returns">FREE returns ▾</div>
    <div class="vat-note">The prices of products sold include VAT. Depending on your delivery address, VAT may vary at checkout.</div>

    <div class="section-label">Colour: <b id="colourName"></b></div>
    <div class="swatch-row" id="skuSwatches"></div>

    <div class="size-row">
      <label for="sizeSelect">Size:</label>
      <select id="sizeSelect"></select>
    </div>

    <button class="add-cart">Add to Cart</button>
    <button class="buy-now">Buy Now</button>
  </div>

</div>

<script>
const SKUS = {
  SKU_A: {
    name: "SKU_A",
    shortName: "Carhartt Work Boot",
    title: "Carhartt 6\" Waterproof Steel Toe Work Boot — Men's",
    colourName: "Dark Bison Brown Full-Grain Leather",
    price: 189.99, rrp: 219.99, discount: -14,
    rating: 4.6, reviews: "1,842", bought: "50+",
    sizes: [7,7.5,8,8.5,9,9.5,10,10.5,11,11.5,12,13],
    renderFrames: [1,2,3],
    modelExposure: 2.2,
    lifestyle: ["2_lifestyle_ladder_worn.png"],
  },
  SKU_C: {
    name: "SKU_C",
    shortName: "Salomon X Ultra 4",
    title: "Salomon X Ultra 4 GTX Hiking Shoe — Women's",
    colourName: "White / Quiet Shade / Opal Blue",
    price: 139.99, rrp: 160.00, discount: -13,
    rating: 4.5, reviews: "5,921", bought: "200+",
    sizes: [6,6.5,7,7.5,8,8.5,9,9.5,10,10.5,11],
    renderFrames: [1,2,3],
    modelExposure: 1.4,
    lifestyle: ["1_shoe_on_rock_summit.png","2_stepping_snowy_rock.png"],
  },
};

const ORDER = ["SKU_A","SKU_C"];
let currentSku = "SKU_A";
let currentThumbIndex = 0;

function mediaListFor(skuKey) {
  const d = SKUS[skuKey];
  const items = [];
  d.renderFrames.forEach(i => {
    const n = String(i).padStart(4, "0");
    items.push({ type: "image", src: `assets/${skuKey}/renders/${n}.png` });
  });
  d.lifestyle.forEach(f => items.push({ type: "image", src: `assets/${skuKey}/lifestyle/${f}` }));
  items.push({ type: "video", src: `assets/${skuKey}/video.mp4` });
  return items;
}

function fmtPrice(v) {
  return v.toFixed(2).replace(".", ",");
}

function renderStars(rating) {
  const full = Math.round(rating);
  let s = "";
  for (let i = 0; i < 5; i++) s += i < full ? "★" : "☆";
  return s;
}

function setMainstageImage(src) {
  const stage = document.getElementById("mainstage");
  stage.innerHTML = `<img src="${src}" alt="">`;
}
function setMainstageVideo(src) {
  const stage = document.getElementById("mainstage");
  stage.innerHTML = `<video src="${src}" controls autoplay muted loop playsinline></video>`;
}
function setMainstageModel(skuKey) {
  const stage = document.getElementById("mainstage");
  const exposure = SKUS[skuKey].modelExposure || 1.4;
  stage.innerHTML = `<model-viewer src="assets/${skuKey}/model.glb"
      environment-image="assets/studio_small_09_1k.hdr"
      exposure="${exposure}" shadow-intensity="1" camera-controls auto-rotate
      camera-orbit="35deg 75deg auto" field-of-view="30deg"
      style="background:#ffffff"></model-viewer>`;
}

function renderThumbs(skuKey) {
  const items = mediaListFor(skuKey);
  const thumbs = document.getElementById("thumbs");
  thumbs.innerHTML = "";
  items.forEach((item, idx) => {
    const el = document.createElement("div");
    el.className = "thumb" + (idx === 0 ? " active" : "") + (item.type === "video" ? " video-thumb" : "");
    const thumbSrc = item.type === "video" ? items[0].src : item.src;
    el.innerHTML = `<img src="${thumbSrc}" alt="">`;
    el.addEventListener("click", () => {
      document.querySelectorAll(".thumb").forEach(t => t.classList.remove("active"));
      el.classList.add("active");
      document.getElementById("view3dBtn").classList.remove("active");
      if (item.type === "video") setMainstageVideo(item.src);
      else setMainstageImage(item.src);
    });
    thumbs.appendChild(el);
  });
}

function renderSkuSwitch() {
  const wrap = document.getElementById("skuSwitch");
  wrap.innerHTML = "";
  ORDER.forEach(key => {
    const d = SKUS[key];
    const btn = document.createElement("button");
    btn.className = key === currentSku ? "active" : "";
    btn.innerHTML = `<img src="assets/${key}/renders/0001.png" alt="">
      <span class="sw-name">${d.shortName}</span>
      <span class="sw-price">€${fmtPrice(d.price)}</span>`;
    btn.addEventListener("click", () => loadSku(key));
    wrap.appendChild(btn);
  });
}

function renderSwatchesPanel() {
  const wrap = document.getElementById("skuSwatches");
  wrap.innerHTML = "";
  ORDER.forEach(key => {
    const d = SKUS[key];
    const el = document.createElement("div");
    el.className = "swatch" + (key === currentSku ? " selected" : "");
    el.innerHTML = `<img src="assets/${key}/renders/0001.png" alt="">
      <div class="sp">€${fmtPrice(d.price)}<span class="sp-old">€${fmtPrice(d.rrp)}</span></div>`;
    el.addEventListener("click", () => loadSku(key));
    wrap.appendChild(el);
  });
}

function renderSizes(skuKey) {
  const sel = document.getElementById("sizeSelect");
  sel.innerHTML = "";
  SKUS[skuKey].sizes.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = s + " US";
    sel.appendChild(opt);
  });
}

function loadSku(skuKey) {
  currentSku = skuKey;
  const d = SKUS[skuKey];

  document.getElementById("title").textContent = d.title;
  document.getElementById("colourName").textContent = d.colourName;
  document.getElementById("stars").textContent = renderStars(d.rating) + "  " + d.rating;
  document.getElementById("reviewCount").textContent = `(${d.reviews})`;
  document.getElementById("boughtLine").textContent = `${d.bought} bought in past month`;
  document.getElementById("discount").textContent = d.discount + "%";
  document.getElementById("priceMain").innerHTML = `€<span>${fmtPrice(d.price)}</span>`;
  document.getElementById("rrp").textContent = `Recommended Price: €${fmtPrice(d.rrp)}`;
  document.getElementById("storeLink").textContent = `Visit the ${d.title.split(" ")[0]} Store`;

  renderThumbs(skuKey);
  const items = mediaListFor(skuKey);
  if (items[0].type === "video") setMainstageVideo(items[0].src); else setMainstageImage(items[0].src);
  document.getElementById("view3dBtn").classList.remove("active");

  renderSkuSwitch();
  renderSwatchesPanel();
  renderSizes(skuKey);
}

document.getElementById("view3dBtn").addEventListener("click", () => {
  document.querySelectorAll(".thumb").forEach(t => t.classList.remove("active"));
  document.getElementById("view3dBtn").classList.add("active");
  setMainstageModel(currentSku);
});

loadSku("SKU_A");
</script>

</body>
</html>
